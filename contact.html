    <span>+27 64 507 5884</span></div><div><strong>Email</strong>

<form class="contact-form" action="#" method="post">
<div class="form-group"><label for="name">Full Name</label>
    <input id="name" name="name" type="text" required></div>
<div class="form-group"><label for="email">Email Address</label>

<div class="form-group"><label for="phone">Phone Number</label>
    <input id="phone" name="phone" type="tel"></div>
<div class="form-group"><label for="message">Message</label>
    <textarea id="message" name="message" required></textarea></div>
<button class="button" type="submit">Send Message</button>
</form>
